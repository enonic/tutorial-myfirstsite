<!DOCTYPE html>
<html>
  <head>
    <title data-th-text="${displayName}">Sample title</title>
    <link rel="stylesheet" data-th-href="${cssUrl}"/>
  </head>
  <body>
    <header>
      <h1 data-th-text="${displayName}">Sample header</h1>
    </header>
    <main data-portal-region="main">
      <div data-th-each="component : ${mainRegion.components}" data-th-remove="tag">
        <div data-portal-component="${component.path}" data-th-remove="tag"></div>
      </div>
    </main>
    <footer>
      <a data-th-href="${csvUrl}">Countries as CSV</a>
    </footer>
  </body>
</html>
